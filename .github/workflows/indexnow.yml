name: IndexNow

# scripts/indexnow.py existed but nothing ran it, so Bing, Copilot and Yandex
# only ever found the site by waiting for a crawl. This submits every URL in
# sitemap.xml right after Pages has finished publishing the commit.
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '**/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to serve the new build
        # submitting before the deploy lands would send crawlers to the old HTML
        run: sleep 90

      - name: Submit sitemap URLs to IndexNow
        run: python3 scripts/indexnow.py
